# ============================================================================
# This workflow runs after a PR is merged into master (a `push` to master is
# exactly what a merge produces). It re-validates everything, then for each
# of the 6 microservices: builds its Docker image, scans it for
# vulnerabilities, records what's inside it (SBOM), and - only if all of
# that succeeds - publishes it to Docker Hub.
# ============================================================================

name: Build, Scan & Publish

on:
  push:
    branches: [master]

permissions:
  contents: read
  security-events: write

jobs:
  # Re-runs the SAME reusable workflow used by pr.yml. This is deliberate:
  # the requirement was "check everything again" on merge, not just trust
  # that the PR's checks were enough (someone could have pushed directly, or
  # the branch could be behind master).
  checks:
    uses: ./.github/workflows/ci-checks.yml
    secrets: inherit

  build-scan-publish:
    # `needs: checks` makes this job WAIT for the `checks` job above to
    # finish successfully first. Without `needs:`, jobs run in parallel by
    # default and wouldn't be ordered at all.
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # If building the `ratings` image fails, keep building the other 5 anyway instead of cancelling them.
      matrix:
        service: [productpage, details, ratings, reviews, mongodb, mysql]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4 # Enables Docker "Buildx" (BuildKit), which is what gives us the GitHub Actions cache support used below.

      - name: Build image (local, cached)
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.service }} # Folder containing this service's Dockerfile; ${{ matrix.service }} swaps in per matrix run (e.g. ./ratings).
          tags: |
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/bookinfo-${{ matrix.service }}:latest
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/bookinfo-${{ matrix.service }}:${{ github.sha }}
          load: true # Load the finished image into the runner's local Docker daemon (needed so Trivy/SBOM below can inspect it) instead of immediately pushing it.
          push: false # We push explicitly later, only after the scan passes - see the "Push to Docker Hub" step.
          # Per-service cache scope: GitHub Actions cache backend (~10GB/repo).
          # "mode=max" also caches intermediate build-stage layers (e.g. the
          # reviews gradle builder stage), not just the final stage.
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/bookinfo-${{ matrix.service }}:${{ github.sha }}
          format: table
          severity: CRITICAL
          exit-code: "1" # fail the job (and block the push below) on CRITICAL findings

      - name: Generate SBOM
        # SBOM = Software Bill of Materials: a machine-readable list of every
        # package/library inside the image (and its version), used later for
        # license/vulnerability auditing without having to re-scan the image.
        uses: anchore/sbom-action@v0
        with:
          image: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/bookinfo-${{ matrix.service }}:${{ github.sha }}
          format: spdx-json
          output-file: sbom-${{ matrix.service }}.spdx.json

      - name: Upload SBOM artifact
        # "Artifacts" are files a workflow run produces that you can download
        # from the run's summary page in the GitHub UI (Actions tab), even
        # after the runner VM is destroyed. Here we keep each service's SBOM
        # for 90 days.
        uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ matrix.service }}
          path: sbom-${{ matrix.service }}.spdx.json
          retention-days: 90

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push to Docker Hub
        # This step only runs if every step above it succeeded (a failing
        # step stops the job by default) - so a CRITICAL Trivy finding blocks
        # the image from ever reaching Docker Hub.
        run: |
          docker push docker.io/${{ secrets.DOCKERHUB_USERNAME }}/bookinfo-${{ matrix.service }}:latest
          docker push docker.io/${{ secrets.DOCKERHUB_USERNAME }}/bookinfo-${{ matrix.service }}:${{ github.sha }}
